AWSTemplateFormatVersion: '2010-09-09'
Description: RDS (PostgreSQL) Stack with Managed Master Password

Parameters:
  Environment:
    Type: String
  ProjectName:
    Type: String
  SubnetPrivate1:
    Type: AWS::EC2::Subnet::Id
  SubnetPrivate2:
    Type: AWS::EC2::Subnet::Id
  RDSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RDSInstanceClass:
    Type: String

Resources:
  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref SubnetPrivate1
        - !Ref SubnetPrivate2
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-rds-subnet-group"

  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${Environment}-${ProjectName}-db"
      AllocatedStorage: 20
      DBInstanceClass: !Ref RDSInstanceClass
      Engine: postgres
      EngineVersion: 16.3
      ManageMasterUserPassword: true
      MasterUsername: postgres
      VPCSecurityGroups:
        - !Ref RDSSecurityGroupId
      DBSubnetGroupName: !Ref RDSSubnetGroup
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: gp2
      DeletionProtection: false

Outputs:
  RDSEndpoint:
    Description: The RDS instance endpoint
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub "${Environment}-${ProjectName}-rds-endpoint"

  RDSSecretArn:
    Description: ARN of the managed master user secret
    Value: !GetAtt RDSInstance.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "${Environment}-${ProjectName}-rds-secret-arn"
