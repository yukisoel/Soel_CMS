name: Build and Deploy to AWS ECR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Build Docker image
        run: |
          aws ecr get-login-password --region ${{vars.AWS_REGION}} | docker login --username AWS --password-stdin ${{vars.AWS_ACCOUNT_ID}}.dkr.ecr.${{vars.AWS_REGION}}.amazonaws.com
          
          cd backend
          docker build -f Dockerfile-gitops -t ${{vars.ECR_REPOSITORY_NAME}} .
          docker tag ${{vars.ECR_REPOSITORY_NAME}}:latest ${{vars.AWS_ACCOUNT_ID}}.dkr.ecr.${{vars.AWS_REGION}}.amazonaws.com/${{vars.ECR_REPOSITORY_NAME}}:latest
          docker push ${{vars.AWS_ACCOUNT_ID}}.dkr.ecr.${{vars.AWS_REGION}}.amazonaws.com/${{vars.ECR_REPOSITORY_NAME}}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy to ECS
        run: |
          cd ${{github.workspace}}/gitops  
          
          export APPSPEC_STRING=$(cat appspec.json | jq '@json')
          echo $APPSPEC_STRING
          aws deploy create-deployment \
          --application-name ${{vars.CODEDEPLOY_APPLICATION_NAME}} \
          --deployment-group-name ${{vars.CODEDEPLOY_DEPLOYMENT_GROUP_NAME}} \
          --revision revisionType=AppSpecContent,appSpecContent={content=${APPSPEC_STRING}}
