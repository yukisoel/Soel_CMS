name: Deploy App to Dev on push to main

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_exists: ${{ steps.check.outputs.image_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "ENV=dev" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "IMAGE_TAG=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and Push app-image
        id: build-and-push
        run: |
          cd infra
          pwd
          chmod +x ./scripts/push-image.sh
          ./scripts/push-image.sh "${ENV}" "${IMAGE_TAG}"

      - name: Run Blue/Green Deploy at that commit
        id: deploy-app
        run: |
          cd infra
          pwd
          chmod +x ./scripts/deploy-app.sh
          ./scripts/deploy-app.sh "${ENV}" "${IMAGE_TAG}"
