app:
  redirect:
    url: https://cmssoel.click/edit
  base-url: https://cmssoel.click

server:
  forward-headers-strategy: framework

spring:
  datasource:
    driver-class-name: com.amazonaws.secretsmanager.sql.AWSSecretsManagerPostgreSQLDriver
    url: >-
      jdbc-secretsmanager:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      ?secretId=arn:aws:secretsmanager:ap-northeast-1:211125631266:secret:rds!db-4bbb2b7c-00e2-41c5-8dde-aa864983e1ba-IcFAT2
      &region=ap-northeast-1
  security:
    oauth2:
      client:
        registration:
          cognito:
            redirect-uri: "https://cmssoel.click/login/oauth2/code/cognito"
          google:
            redirect-uri: "https://cmssoel.click/login/oauth2/code/google"
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org:
      springframework:
        security: DEBUG
        web: DEBUG

