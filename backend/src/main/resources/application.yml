spring:
  application:
    name: backend
  profiles:
    active: local
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
#          facebook:
#            client-id: ${FACEBOOK_CLIENT_ID}
#            client-secret: ${FACEBOOK_CLIENT_SECRET}
#            scope: ${FACEBOOK_SCOPE}
#            redirect-uri: "{baseUrl}/login/oauth2/code/facebook"
          cognito:
            provider: cognito
            client-id: ${COGNITO_CLIENT_ID}
            client-secret: ${COGNITO_CLIENT_SECRET}
            scope: openid,profile,email
#            redirect-uri: "{baseUrl}/login/oauth2/code/cognito"
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: ${GOOGLE_SCOPE}
#            redirect-uri: "{baseUrl}/login/oauth2/code/google"
        provider:
            cognito:
              issuer-uri: https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}


#          facebook:
#            authorization-uri: https://www.facebook.com/v20.0/dialog/oauth
#            token-uri: https://graph.facebook.com/v20.0/oauth/access_token
#            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture



logging:
  level:
    org.springframework.web.cors: DEBUG
